[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lead-enrichment-engine"
version = "1.0.0"
description = "Zero-API-cost lead enrichment via SMTP verification, domain detection, and email pattern prediction"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28.0",
    "httpx>=0.27.0",
    "dnspython>=2.4.0",
]

[project.optional-dependencies]
proxy = ["free-proxy>=1.1.1"]
dev = ["pytest>=7.0"]

[project.scripts]
enrich-lead = "lead_enrichment.cli:main"

[tool.setuptools.packages.find]
include = ["lead_enrichment*"]
